name: Build Multi-Platform Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.11"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

# ======================
# LINUX
# ======================
  build-linux:
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm

    steps:
      - uses: actions/checkout@v4

      - name: Sync version.txt with tag
        run: echo "${GITHUB_REF_NAME#v}" > version.txt

      - name: Install dependencies
        run: |
          apt update
          apt install -y python3 python3-venv python3-pip build-essential \
          wget xz-utils file imagemagick libpython3.11
          python3 -m venv venv
          . venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller PySide6 bcrypt requests charset-normalizer chardet

      - name: Build Linux binary
        run: |
          . venv/bin/activate
          pyinstaller \
            --onefile app.py \
            --name Gestion_Fertilisant_linux \
            --add-data "version.txt:." \
            --hidden-import cvxpy \
            --hidden-import bcrypt \
            --hidden-import charset_normalizer \
            --hidden-import chardet \
            --hidden-import _bootlocale \
            --collect-all cvxpy \
            --collect-all osqp \
            --collect-all ecos \
            --collect-all scs \
            --collect-all charset_normalizer

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/Gestion_Fertilisant_linux


# ======================
# WINDOWS + INNO SETUP
# ======================
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Sync version.txt with tag
        shell: bash
        run: echo "${GITHUB_REF_NAME#v}" > version.txt

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller bcrypt PySide6 requests charset-normalizer chardet
          pip install cvxpy osqp ecos scs

      - name: Build Windows executable
        shell: bash
        run: |
          pyinstaller \
            --onefile app.py \
            --name Gestion_Fertilisant_windows \
            --add-data "version.txt;." \
            --hidden-import cvxpy \
            --hidden-import bcrypt \
            --hidden-import charset_normalizer \
            --hidden-import chardet \
            --collect-all cvxpy \
            --collect-all osqp \
            --collect-all ecos \
            --collect-all scs \
            --collect-all charset_normalizer

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build Windows installer
        shell: powershell
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\installer.iss

      - name: Upload Windows exe
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/Gestion_Fertilisant_windows.exe

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: installer/Output/GestionFertilisant_Setup.exe


# ======================
# MACOS
# ======================
  build-macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Sync version.txt with tag
        run: echo "${GITHUB_REF_NAME#v}" > version.txt

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt
          python3 -m pip install pyinstaller bcrypt PySide6 requests \
            charset-normalizer chardet cvxpy osqp ecos scs

      - name: Build macOS binary
        run: |
          pyinstaller \
            --onefile app.py \
            --name Gestion_Fertilisant_macos \
            --add-data "version.txt:." \
            --hidden-import cvxpy \
            --hidden-import bcrypt \
            --hidden-import charset_normalizer \
            --hidden-import chardet \
            --collect-all cvxpy \
            --collect-all osqp \
            --collect-all ecos \
            --collect-all scs \
            --collect-all charset_normalizer

      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/Gestion_Fertilisant_macos


# ======================
# RELEASE
# ======================
  release:
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows, build-macos]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release

      - name: Show files
        run: ls -R release

      - name: Update version.json
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          cat > releases/version.json << EOF
          {
            "version": "${VERSION}",
            "linux": "https://github.com/gestion-agro/gestion_fertilisants/releases/latest/download/Gestion_Fertilisant_linux",
            "windows": "https://github.com/gestion-agro/gestion_fertilisants/releases/latest/download/GestionFertilisant_Setup.exe",
            "macos": "https://github.com/gestion-agro/gestion_fertilisants/releases/latest/download/Gestion_Fertilisant_macos"
          }
          EOF
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add releases/version.json
          git commit -m "Update version.json to ${VERSION} [skip ci]" || true
          git push origin HEAD:main || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/linux/Gestion_Fertilisant_linux
            release/windows-exe/Gestion_Fertilisant_windows.exe
            release/windows-installer/GestionFertilisant_Setup.exe
            release/macos/Gestion_Fertilisant_macos
          name: "Version ${{ github.ref_name }}"
          overwrite_files: true
          body: |
            ## Version ${{ github.ref_name }}

            ### Téléchargement
            - **Windows** (recommandé) : `GestionFertilisant_Setup.exe` — installateur
            - **Windows** (portable) : `Gestion_Fertilisant_windows.exe`
            - **Linux** : `Gestion_Fertilisant_linux`
            - **macOS** : `Gestion_Fertilisant_macos`

            ### Premier lancement
            La base de données est créée automatiquement dans `~/.GestionFertilisants/`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}