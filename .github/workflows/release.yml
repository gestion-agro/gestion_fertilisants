name: Build Linux Release (Debian 12)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest   # GitHub Actions runner, mais le build sera dans Docker Debian 12

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build with Debian 12 Docker
        run: |
          docker run --rm -v $PWD:/app -w /app debian:bookworm bash -c "
            apt update && apt install -y python3 python3-venv python3-pip build-essential libgl1-mesa-glx libglib2.0-0
            python3 -m venv /tmp/venv
            source /tmp/venv/bin/activate
            pip install --upgrade pip
            pip install pyinstaller PySide6 requests
            pyinstaller --onefile app.py --name Gestion_Fertilisant --add-data 'version.txt:.'
          "

      - name: Prepare archive
        run: |
          mkdir release
          cp dist/Gestion_Fertilisant release/
          echo ${GITHUB_REF_NAME#v} > release/version.txt
          cd release
          tar -czf Gestion_Fertilisant-linux-${GITHUB_REF_NAME}.tar.gz Gestion_Fertilisant version.txt

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/Gestion_Fertilisant-linux-*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
