name: Build Multi-Platform Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # ======================
  # LINUX: .deb + AppImage
  # ======================
  build-linux:
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm

    steps:
      - uses: actions/checkout@v4

      # ----------------------
      # Install deps
      # ----------------------
      - name: Install deps
        run: |
          apt update
          apt install -y python3 python3-venv python3-pip build-essential \
          fakeroot dpkg-dev libglib2.0-0 wget xz-utils imagemagick file

          python3 -m venv /tmp/venv
          . /tmp/venv/bin/activate
          pip install --upgrade pip
          pip install pyinstaller PySide6 requests

          # icon fix
          if [ -f icon.ico ]; then
            convert icon.ico -resize 256x256 icon.png
          fi

      # ----------------------
      # Build binary
      # ----------------------
      - name: Build binary
        run: |
          . /tmp/venv/bin/activate
          pyinstaller --onefile app.py --name Gestion_Fertilisant --add-data 'version.txt:.'
          mv dist/Gestion_Fertilisant dist/Gestion_Fertilisant_linux

      # ----------------------
      # Build .deb
      # ----------------------
      - name: Build deb
        run: |
          mkdir -p deb_package/DEBIAN
          mkdir -p deb_package/usr/local/bin
          mkdir -p deb_package/usr/share/applications
          mkdir -p deb_package/usr/share/icons/hicolor/256x256/apps

          cp dist/Gestion_Fertilisant_linux deb_package/usr/local/bin/Gestion_Fertilisant
          cp icon.png deb_package/usr/share/icons/hicolor/256x256/apps/Gestion_Fertilisant.png || true

          cat > deb_package/usr/share/applications/Gestion_Fertilisant.desktop <<EOF
          [Desktop Entry]
          Name=Gestion Fertilisant
          Exec=/usr/local/bin/Gestion_Fertilisant
          Icon=Gestion_Fertilisant
          Terminal=false
          Type=Application
          Categories=Utility;
          EOF

          cat > deb_package/DEBIAN/control <<EOF
          Package: gestion-fertilisant
          Version: ${GITHUB_REF_NAME#v}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Clement
          Description: Gestion Fertilisant
          EOF

          dpkg-deb --build deb_package Gestion_Fertilisant_${GITHUB_REF_NAME#v}_amd64.deb

      # ----------------------
      # Build AppImage
      # ----------------------
      - name: Build AppImage
        run: |
          wget https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage

          # CI FIX → extract instead of mount
          ./linuxdeploy-x86_64.AppImage --appimage-extract
          mv squashfs-root linuxdeploy

          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps

          cp dist/Gestion_Fertilisant_linux AppDir/usr/bin/Gestion_Fertilisant
          cp icon.png AppDir/usr/share/icons/hicolor/256x256/apps/Gestion_Fertilisant.png || true

          cat > AppDir/usr/share/applications/Gestion_Fertilisant.desktop <<EOF
          [Desktop Entry]
          Name=Gestion Fertilisant
          Exec=Gestion_Fertilisant
          Icon=Gestion_Fertilisant
          Terminal=false
          Type=Application
          Categories=Utility;
          EOF

          ./linuxdeploy/AppRun \
            --appdir AppDir \
            --desktop-file AppDir/usr/share/applications/Gestion_Fertilisant.desktop \
            --icon-file icon.png \
            --output appimage \
            --no-appstream

      - name: Upload Linux
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            *.deb
            *.AppImage


  # ======================
  # WINDOWS
  # ======================
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller PySide6 requests

      - name: Build exe
        run: |
          pyinstaller --onefile app.py --name Gestion_Fertilisant_windows.exe --add-data "version.txt;."

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/Gestion_Fertilisant_windows.exe

  # ======================
  # MACOS
  # ======================
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pyinstaller PySide6 requests

      - name: Build macOS binary
        run: |
          python3 -m PyInstaller --onefile app.py --name Gestion_Fertilisant --add-data "version.txt:."
          mv dist/Gestion_Fertilisant dist/Gestion_Fertilisant_macos

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/Gestion_Fertilisant_macos

  # ======================
  # RELEASE
  # ======================
  release:
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows, build-macos]

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release

      - name: Show files
        run: ls -R release

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/**/*
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
