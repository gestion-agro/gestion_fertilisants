name: Build Multi-Platform Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:

  # ======================
  # LINUX
  # ======================
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        run: |
          sudo apt update
          sudo apt install -y python3 python3-venv python3-pip build-essential fakeroot dpkg-dev libgl1 libglib2.0-0
          python3 -m venv /tmp/venv
          source /tmp/venv/bin/activate
          pip install --upgrade pip pyinstaller PySide6 requests

      - name: Build Linux binary
        run: |
          source /tmp/venv/bin/activate
          pyinstaller --onefile app.py --name Gestion_Fertilisant --add-data 'version.txt:.'
          mv dist/Gestion_Fertilisant dist/Gestion_Fertilisant_linux

      - name: Create .deb
        run: |
          mkdir -p deb_package/DEBIAN
          mkdir -p deb_package/usr/local/bin

          cp dist/Gestion_Fertilisant_linux deb_package/usr/local/bin/Gestion_Fertilisant

          echo "Package: gestion-fertilisant" > deb_package/DEBIAN/control
          echo "Version: ${GITHUB_REF_NAME#v}" >> deb_package/DEBIAN/control
          echo "Section: utils" >> deb_package/DEBIAN/control
          echo "Priority: optional" >> deb_package/DEBIAN/control
          echo "Architecture: amd64" >> deb_package/DEBIAN/control
          echo "Maintainer: Clement" >> deb_package/DEBIAN/control
          echo "Description: Gestion Fertilisant" >> deb_package/DEBIAN/control

          dpkg-deb --build deb_package

          mkdir -p dist
          mv deb_package.deb dist/Gestion_Fertilisant_${GITHUB_REF_NAME#v}_amd64.deb || mv deb_package dist/Gestion_Fertilisant_${GITHUB_REF_NAME#v}_amd64.deb

          echo "FILES DIST:"
          ls -lah dist

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/Gestion_Fertilisant_linux
            Gestion_Fertilisant_${GITHUB_REF_NAME#v}_amd64.deb


  # ======================
  # WINDOWS
  # ======================
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller PySide6 requests

      - name: Build exe
        run: |
          pyinstaller --onefile app.py --name Gestion_Fertilisant_windows.exe --add-data "version.txt;."

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/Gestion_Fertilisant_windows.exe


  # ======================
  # MACOS
  # ======================
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pyinstaller PySide6 requests

      - name: Build macOS binary
        run: |
          python3 -m PyInstaller --onefile app.py --name Gestion_Fertilisant --add-data "version.txt:."
          mv dist/Gestion_Fertilisant dist/Gestion_Fertilisant_macos

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/Gestion_Fertilisant_macos


  # ======================
  # RELEASE
  # ======================
  release:
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows, build-macos]

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release

      - name: Show files
        run: ls -R release

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/**/*
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
