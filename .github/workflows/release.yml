name: Build Multi-Platform Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # ======================
  # LINUX: .deb + AppImage
  # ======================
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        run: |
          sudo apt update
          sudo apt install -y python3 python3-venv python3-pip build-essential fakeroot dpkg-dev libglib2.0-0 wget xz-utils
          python3 -m venv /tmp/venv
          source /tmp/venv/bin/activate
          pip install --upgrade pip pyinstaller PySide6 requests

      # ----------------------
      # Build Linux binary
      # ----------------------
      - name: Build Linux binary
        run: |
          source /tmp/venv/bin/activate
          pyinstaller --onefile app.py --name Gestion_Fertilisant --add-data 'version.txt:.'
          mv dist/Gestion_Fertilisant dist/Gestion_Fertilisant_linux

      # ----------------------
      # Create .deb package
      # ----------------------
      - name: Create .deb
        run: |
          mkdir -p deb_package/DEBIAN
          mkdir -p deb_package/usr/local/bin
          mkdir -p deb_package/usr/local/share/Gestion_Fertilisant
          mkdir -p deb_package/usr/share/applications

          cp dist/Gestion_Fertilisant_linux deb_package/usr/local/bin/Gestion_Fertilisant
          cp version.txt deb_package/usr/local/share/Gestion_Fertilisant/
          cp icon.ico deb_package/usr/local/share/Gestion_Fertilisant/ || true

          echo "Package: gestion-fertilisant" > deb_package/DEBIAN/control
          echo "Version: ${GITHUB_REF_NAME#v}" >> deb_package/DEBIAN/control
          echo "Section: utils" >> deb_package/DEBIAN/control
          echo "Priority: optional" >> deb_package/DEBIAN/control
          echo "Architecture: amd64" >> deb_package/DEBIAN/control
          echo "Maintainer: Clement" >> deb_package/DEBIAN/control
          echo "Description: Gestion Fertilisant" >> deb_package/DEBIAN/control

          dpkg-deb --build deb_package Gestion_Fertilisant_${GITHUB_REF_NAME#v}_amd64.deb

      # ----------------------
      # Create AppImage
      # ----------------------
      - name: Build AppImage
        run: |
          # Installer linuxdeploy et plugin AppImage
          wget https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage

          # Préparer répertoire AppDir
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps

          cp dist/Gestion_Fertilisant_linux AppDir/usr/bin/Gestion_Fertilisant
          cp icon.ico AppDir/usr/share/icons/hicolor/256x256/apps/Gestion_Fertilisant.png

          # Créer fichier .desktop pour menu
          echo "[Desktop Entry]" > AppDir/usr/share/applications/Gestion_Fertilisant.desktop
          echo "Name=Gestion Fertilisant" >> AppDir/usr/share/applications/Gestion_Fertilisant.desktop
          echo "Exec=Gestion_Fertilisant" >> AppDir/usr/share/applications/Gestion_Fertilisant.desktop
          echo "Icon=Gestion_Fertilisant" >> AppDir/usr/share/applications/Gestion_Fertilisant.desktop
          echo "Terminal=false" >> AppDir/usr/share/applications/Gestion_Fertilisant.desktop
          echo "Type=Application" >> AppDir/usr/share/applications/Gestion_Fertilisant.desktop
          echo "Categories=Utility;" >> AppDir/usr/share/applications/Gestion_Fertilisant.desktop

          # Générer l’AppImage
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --output appimage

      # ----------------------
      # Upload Linux artifacts
      # ----------------------
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: |
            Gestion_Fertilisant_linux*.deb
            Gestion_Fertilisant*.AppImage

  # ======================
  # WINDOWS
  # ======================
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller PySide6 requests

      - name: Build exe
        run: |
          pyinstaller --onefile app.py --name Gestion_Fertilisant_windows.exe --add-data "version.txt;."

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/Gestion_Fertilisant_windows.exe

  # ======================
  # MACOS
  # ======================
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pyinstaller PySide6 requests

      - name: Build macOS binary
        run: |
          python3 -m PyInstaller --onefile app.py --name Gestion_Fertilisant --add-data "version.txt:."
          mv dist/Gestion_Fertilisant dist/Gestion_Fertilisant_macos

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/Gestion_Fertilisant_macos

  # ======================
  # RELEASE
  # ======================
  release:
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows, build-macos]

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release

      - name: Show files
        run: ls -R release

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/**/*
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
