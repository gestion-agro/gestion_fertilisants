name: Build Linux Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          pip install pyinstaller
          pip install PySide6 requests

      - name: Build
        run: |
          pyinstaller --onefile app.py --name Gestion_Fertilisant --add-data "version.txt:."

      - name: Prepare archive
        run: |
          mkdir release
          cp dist/Gestion_Fertilisant release/
          echo ${GITHUB_REF_NAME#v} > release/version.txt
          cd release
          tar -czf Gestion_Fertilisant-linux-${GITHUB_REF_NAME}.tar.gz Gestion_Fertilisant version.txt

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/Gestion_Fertilisant-linux-*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
