name: Build Multi-Platform Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # ======================
  # Linux build + .deb
  # ======================
build-linux:
  runs-on: ubuntu-latest
  steps:
    - uses: actions/checkout@v4

    - name: Install system deps
      run: |
        sudo apt update
        sudo apt install -y python3 python3-venv python3-pip build-essential fakeroot dpkg-dev libgl1 libglib2.0-0

    - name: Create venv + install python deps
      run: |
        python3 -m venv venv
        source venv/bin/activate
        pip install --upgrade pip
        pip install pyinstaller PySide6 requests

    - name: Build Linux binary
      run: |
        source venv/bin/activate
        pyinstaller --onefile app.py --name Gestion_Fertilisant --add-data "version.txt:."

    - name: Create .deb
      run: |
        mkdir -p deb_package/DEBIAN
        mkdir -p deb_package/usr/local/bin
        mkdir -p deb_package/usr/local/share/Gestion_Fertilisant
        mkdir -p deb_package/usr/share/applications

        cp dist/Gestion_Fertilisant deb_package/usr/local/bin/
        cp version.txt deb_package/usr/local/share/Gestion_Fertilisant/
        cp icon.png deb_package/usr/local/share/Gestion_Fertilisant/ || true

        echo "[Desktop Entry]" > deb_package/usr/share/applications/gestion_fertilisant.desktop
        echo "Name=Gestion Fertilisant" >> deb_package/usr/share/applications/gestion_fertilisant.desktop
        echo "Exec=/usr/local/bin/Gestion_Fertilisant" >> deb_package/usr/share/applications/gestion_fertilisant.desktop
        echo "Icon=/usr/local/share/Gestion_Fertilisant/icon.png" >> deb_package/usr/share/applications/gestion_fertilisant.desktop
        echo "Terminal=false" >> deb_package/usr/share/applications/gestion_fertilisant.desktop
        echo "Type=Application" >> deb_package/usr/share/applications/gestion_fertilisant.desktop
        echo "Categories=Utility;" >> deb_package/usr/share/applications/gestion_fertilisant.desktop

        echo "Package: gestion-fertilisant" > deb_package/DEBIAN/control
        echo "Version: ${GITHUB_REF_NAME#v}" >> deb_package/DEBIAN/control
        echo "Section: utils" >> deb_package/DEBIAN/control
        echo "Priority: optional" >> deb_package/DEBIAN/control
        echo "Architecture: amd64" >> deb_package/DEBIAN/control
        echo "Maintainer: Clément THIEULEUX" >> deb_package/DEBIAN/control
        echo "Description: Gestion Fertilisant Application" >> deb_package/DEBIAN/control

        dpkg-deb --build deb_package
        mv deb_package.deb Gestion_Fertilisant_${GITHUB_REF_NAME#v}_amd64.deb

    - name: Upload Linux artifact
      uses: actions/upload-artifact@v4
      with:
        name: linux-release
        path: |
          dist/Gestion_Fertilisant
          Gestion_Fertilisant_${GITHUB_REF_NAME#v}_amd64.deb

  # ======================
  # Windows build
  # ======================
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller PySide6 requests

      - name: Build Windows exe
        run: |
          pyinstaller --onefile app.py --name Gestion_Fertilisant.exe --add-data "version.txt;."

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist/Gestion_Fertilisant.exe

  # ======================
  # macOS build
  # ======================
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pyinstaller PySide6 requests

      - name: Build macOS binary
        run: |
          python3 -m PyInstaller --onefile app.py --name Gestion_Fertilisant --add-data "version.txt:."

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: dist/Gestion_Fertilisant

  # ======================
  # Upload all artifacts to GitHub Release
  # ======================
  upload-release:
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows, build-macos]
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-release
          path: release/linux

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release/windows

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-release
          path: release/macos

      - name: Upload all artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/linux/*
            release/windows/*
            release/macos/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
