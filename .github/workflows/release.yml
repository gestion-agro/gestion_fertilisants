name: Build Multi-Platform Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # ======================
  # Linux build (Debian 12 Docker)
  # ======================
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Linux (Debian 12 Docker)
        run: |
          docker run --rm -v $PWD:/app -w /app debian:bookworm bash -c "
            apt update && apt install -y python3 python3-venv python3-pip build-essential libgl1-mesa-glx libglib2.0-0
            python3 -m venv /tmp/venv
            source /tmp/venv/bin/activate
            pip install --upgrade pip
            pip install pyinstaller PySide6 requests
            pyinstaller --onefile app.py --name Gestion_Fertilisant --add-data 'version.txt:.'
          "

      - name: Package Linux
        run: |
          mkdir -p release/linux
          cp dist/Gestion_Fertilisant release/linux/
          echo ${GITHUB_REF_NAME#v} > release/linux/version.txt
          cd release/linux
          tar -czf Gestion_Fertilisant-linux-${GITHUB_REF_NAME}.tar.gz Gestion_Fertilisant version.txt

  # ======================
  # Windows build
  # ======================
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller PySide6 requests

      - name: Build Windows exe
        run: |
          pyinstaller --onefile app.py --name Gestion_Fertilisant.exe --add-data "version.txt;."

      - name: Package Windows
        run: |
          mkdir release\windows
          copy dist\Gestion_Fertilisant.exe release\windows\
          echo ${GITHUB_REF_NAME#v} > release\windows\version.txt

  # ======================
  # macOS build
  # ======================
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install pyinstaller PySide6 requests

      - name: Build macOS app
        run: |
          pyinstaller --onefile app.py --name Gestion_Fertilisant --add-data "version.txt:."

      - name: Package macOS
        run: |
          mkdir -p release/macos
          cp dist/Gestion_Fertilisant release/macos/
          echo ${GITHUB_REF_NAME#v} > release/macos/version.txt

  # ======================
  # Upload all releases to GitHub
  # ======================
  upload-release:
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows, build-macos]
    steps:
      - uses: actions/checkout@v4
      - name: Upload all artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/linux/Gestion_Fertilisant-linux-*.tar.gz
            release/windows/Gestion_Fertilisant.exe
            release/macos/Gestion_Fertilisant
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
