name: Build Multi-Platform Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.11"

jobs:

# ======================
# LINUX
# ======================
  build-linux:
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm
    env:
      VERSION: ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt update
          apt install -y python3 python3-venv python3-pip build-essential \
          wget xz-utils file imagemagick

          python3 -m venv venv
          . venv/bin/activate

          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller PySide6 bcrypt requests charset-normalizer

      - name: Build Linux binary
        run: |
          . venv/bin/activate
          VERSION=${VERSION#v}

          pyinstaller \
            --onefile app.py \
            --name Gestion_Fertilisant_${VERSION}_linux \
            --add-data "version.txt:." \
            --hidden-import cvxpy \
            --collect-all cvxpy \
            --collect-all osqp \
            --collect-all ecos \
            --collect-all scs

      - name: Prepare artifacts
        run: ls -R dist/

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*


# ======================
# WINDOWS + INNO SETUP
# ======================
  build-windows:
    runs-on: windows-latest
    env:
      VERSION: ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller bcrypt PySide6 requests charset-normalizer
          pip install osqp ecos scs

      - name: Build Windows executable
        shell: bash
        run: |
          VERSION=${VERSION#v}

          pyinstaller \
            --onefile app.py \
            --name Gestion_Fertilisant_windows \
            --add-data "version.txt;." \
            --collect-all cvxpy \
            --collect-all osqp \
            --collect-all ecos \
            --collect-all scs

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build Windows installer
        shell: powershell
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\installer.iss

      - name: Upload Windows exe
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/*.exe

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: Output/*.exe


# ======================
# MACOS
# ======================
  build-macos:
    runs-on: macos-latest
    env:
      VERSION: ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt
          python3 -m pip install pyinstaller bcrypt PySide6 requests

      - name: Build macOS binary
        shell: bash
        run: |
          VERSION=${VERSION#v}

          pyinstaller \
            --onefile app.py \
            --name Gestion_Fertilisant_${VERSION}_macos \
            --add-data "version.txt:." \
            --collect-all cvxpy \
            --collect-all osqp \
            --collect-all ecos \
            --collect-all scs

      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*


# ======================
# RELEASE
# ======================
  release:
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows, build-macos]

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release

      - name: Show files
        run: ls -R release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/**/*
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
